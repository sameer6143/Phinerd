<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1c; --muted:#6b6b6b;
    --accent:#2b6cb0; --border:#e3e1db;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141414; --card:#1e1e1e; --ink:#f2f2f2; --muted:#a0a0a0;
      --accent:#5b9bd5; --border:#333;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141414; --card:#1e1e1e; --ink:#f2f2f2; --muted:#a0a0a0;
    --accent:#5b9bd5; --border:#333;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{max-width:480px; margin:0 auto; padding:32px 20px;}
  h1{font-size:1.4rem; margin:0 0 4px;}
  p.sub{color:var(--muted); margin:0 0 24px; font-size:.95rem;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:24px; display:flex; flex-direction:column; gap:14px;
  }
  input[type=text], select{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:transparent; color:var(--ink); font-size:1rem;
  }
  label{font-size:.85rem; color:var(--muted);}
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  input[type=color]{width:100%; height:40px; border-radius:8px; border:1px solid var(--border); background:none;}
  button{
    background:var(--accent); color:#fff; border:none; padding:12px 16px;
    border-radius:10px; font-size:1rem; cursor:pointer; font-weight:600;
  }
  button:active{opacity:.85;}
  #qrbox{
    display:flex; justify-content:center; align-items:center; min-height:220px;
    background:var(--card); border:1px dashed var(--border); border-radius:12px; margin-top:6px;
  }
  #qrbox img, #qrbox canvas{ border-radius:8px; }
  .dl{display:none; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>QR Code Generator</h1>
  <p class="sub">Type a link or text, get an instant QR code.</p>

  <div class="card">
    <div>
      <label>Text or URL</label>
      <input type="text" id="text" placeholder="https://example.com" value="https://example.com">
    </div>

    <div class="row">
      <div>
        <label>Size</label>
        <select id="size">
          <option value="200">Small (200px)</option>
          <option value="300" selected>Medium (300px)</option>
          <option value="400">Large (400px)</option>
        </select>
      </div>
      <div>
        <label>Color</label>
        <input type="color" id="color" value="#1c1c1c">
      </div>
    </div>

    <button onclick="generate()">Generate QR Code</button>

    <div id="qrbox"></div>
    <div class="dl" id="dlwrap">
      <button onclick="download()">Download PNG</button>
    </div>
  </div>
</div>

<script>
let qr;
function generate(){
  const text = document.getElementById('text').value.trim() || 'https://example.com';
  const size = parseInt(document.getElementById('size').value, 10);
  const color = document.getElementById('color').value;
  const box = document.getElementById('qrbox');
  box.innerHTML = '';
  qr = new QRCode(box, {
    text: text,
    width: size,
    height: size,
    colorDark: color,
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  document.getElementById('dlwrap').style.display = 'block';
}
function download(){
  const box = document.getElementById('qrbox');
  const canvas = box.querySelector('canvas');
  if(!canvas) return;
  const link = document.createElement('a');
  link.download = 'qrcode.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
generate();
</script>
</body>
</html>
